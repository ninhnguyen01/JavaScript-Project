<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hulu Login | Hulu</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="image/favicon.ico.png" type="image/x-icon" />
  </head>

  <body>
    <div class="modal">
      <h1 class="login-title">hulu</h1>
      <div class="modal-box">
        <div class="modal-body">
          <h3>Enter your email to continue</h3>
          <p>
            Log in to Hulu with your MyDisney account. If you don't have one,
            you will be prompted to create one.
          </p>
          <form>
            <div class="form-control">
              <label for="email">
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="Email" />
              </label>
            </div>
            <div class="form-control">
              <button type="submit" class="btn btn-dark">Continue</button>
              <a href="index.html" class="btn btn-dark">Back</a>
            </div>
          </form>
        </div>
      </div>

      <br />
      <hr />
      <br />

      <br />
    </div>
  </body>
</html>
