<!DOCTYPE html>

<html lang="en">
  <head>
    <meta
      charset="UTF-8"
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Loan Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <h1>Loan Calculator</h1>
      <p>
        Loan Amount $
        <input
          onchange="calculateLoan()"
          class="input"
          type="number"
          id="loan-amount"
          min="1000"
          max="1000000"
          step="1000"
          placeholder="1000" />
      </p>

      <p>
        Interest Rate %
        <input
          onchange="calculateLoan()"
          class="input"
          type="number"
          id="rate"
          min="0"
          max="100"
          step="1"
          placeholder="0" />
      </p>

      <p>
        Month(s) to Pay
        <input
          onchange="calculateLoan()"
          class="input"
          type="number"
          id="month"
          min="6"
          max="72"
          placeholder="6" />
      </p>

      <p class="payment" id="payment">Monthly Payment:</p>
    </div>
    <script src="script.js"></script>
  </body>
</html>
